name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names agni-guard-backend \
            --region ap-south-1 \
            || aws ecr create-repository \
            --repository-name agni-guard-backend \
            --region ap-south-1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/agni-guard-backend:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/agni-guard-backend:$IMAGE_TAG \
            $ECR_REGISTRY/agni-guard-backend:latest
          docker push $ECR_REGISTRY/agni-guard-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/agni-guard-backend:latest

      - name: Deploy to ECS production
        run: |
          aws ecs update-service \
            --cluster agni-guard-cluster \
            --service agni-guard-backend-production \
            --force-new-deployment \
            --region ap-south-1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ \
            s3://${{ secrets.S3_BUCKET_PROD }} --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "✅ Docker image pushed to ECR"
          echo "✅ ECS service updated"
          echo "✅ Frontend deployed to S3"
          echo "✅ CloudFront cache cleared"